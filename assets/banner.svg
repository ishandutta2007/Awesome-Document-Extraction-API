<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a14" />
      <stop offset="50%" stop-color="#0c1222" />
      <stop offset="100%" stop-color="#0a192f" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="1" />
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="laserGlow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#38bdf8" flood-opacity="0.3" />
    </filter>

    <!-- Background Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.5" />
      <circle cx="40" cy="0" r="1.5" fill="#38bdf8" fill-opacity="0.25" />
    </pattern>
  </defs>

  <style>
    @keyframes scanMotion {
      0% { transform: translateY(0px); opacity: 0.3; }
      50% { transform: translateY(170px); opacity: 1; }
      100% { transform: translateY(0px); opacity: 0.3; }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.85; }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-8px) scale(1.15); }
    }
    .scanner-line {
      animation: scanMotion 4.5s ease-in-out infinite;
    }
    .pulse-glow {
      animation: pulseGlow 3s ease-in-out infinite;
    }
    .floating-dot {
      animation: floatParticle 4s ease-in-out infinite;
    }
    .font-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.025em;
    }
    .font-sub {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 500;
    }
    .font-mono {
      font-family: "JetBrains Mono", Consolas, "Liberation Mono", Menlo, Courier, monospace;
      font-weight: 600;
    }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="360" fill="url(#bgGrad)" rx="16" />
  <rect width="1200" height="360" fill="url(#gridPattern)" rx="16" />

  <!-- Outer Glowing Border -->
  <rect x="1.5" y="1.5" width="1197" height="357" rx="15" fill="none" stroke="url(#primaryGlow)" stroke-width="1.5" stroke-opacity="0.65" />

  <!-- Left Dynamic Element: Futuristic Document Scanner Visual (in background) -->
  <g transform="translate(60, 65)">
    <!-- Document Stack Base -->
    <rect x="20" y="20" width="150" height="200" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5" opacity="0.6" />
    <rect x="10" y="10" width="150" height="200" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5" opacity="0.8" />
    
    <!-- Active Scanning Document -->
    <rect x="0" y="0" width="150" height="200" rx="8" fill="#0b1329" stroke="#60a5fa" stroke-width="1.8" />
    
    <!-- Stylized Extracted Elements on Document -->
    <line x1="20" y1="30" x2="80" y2="30" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <line x1="20" y1="48" x2="130" y2="48" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
    <line x1="20" y1="62" x2="115" y2="62" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
    <line x1="20" y1="76" x2="125" y2="76" stroke="#64748b" stroke-width="2" stroke-linecap="round" />

    <!-- Table Outline inside Document -->
    <rect x="18" y="94" width="114" height="60" rx="4" fill="#1e293b" stroke="#3b82f6" stroke-width="1" stroke-dasharray="3,2" />
    <line x1="18" y1="114" x2="132" y2="114" stroke="#475569" stroke-width="1" />
    <line x1="55" y1="94" x2="55" y2="154" stroke="#475569" stroke-width="1" />
    <line x1="92" y1="94" x2="92" y2="154" stroke="#475569" stroke-width="1" />

    <line x1="20" y1="172" x2="100" y2="172" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
    <line x1="20" y1="184" x2="70" y2="184" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />

    <!-- Dynamic Scanning Beam Line -->
    <g class="scanner-line">
      <rect x="-10" y="10" width="170" height="4" fill="url(#laserGrad)" filter="url(#laserGlow)" rx="2" />
      <polygon points="75,10 65,5 85,5" fill="#a855f7" opacity="0.8" />
      <polygon points="75,14 65,19 85,19" fill="#a855f7" opacity="0.8" />
    </g>
  </g>

  <!-- Right Dynamic Element: Vector Flow / JSON Output Graph Visual -->
  <g transform="translate(1000, 75)">
    <!-- Circuit / Graph Nodes -->
    <circle cx="70" cy="30" r="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2" class="pulse-glow" />
    <text x="70" y="34" fill="#38bdf8" font-size="10" text-anchor="middle" class="font-mono">OCR</text>

    <line x1="70" y1="48" x2="40" y2="90" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,3" />
    <line x1="70" y1="48" x2="100" y2="90" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,3" />

    <circle cx="35" cy="105" r="16" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
    <text x="35" y="109" fill="#818cf8" font-size="9" text-anchor="middle" class="font-mono">VLM</text>

    <circle cx="105" cy="105" r="16" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" />
    <text x="105" y="109" fill="#a855f7" font-size="9" text-anchor="middle" class="font-mono">IDP</text>

    <line x1="35" y1="121" x2="70" y2="160" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,3" />
    <line x1="105" y1="121" x2="70" y2="160" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,3" />

    <rect x="25" y="160" width="90" height="32" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.8" />
    <text x="70" y="180" fill="#34d399" font-size="11" text-anchor="middle" class="font-mono">{ JSON }</text>
  </g>

  <!-- Floating Ambient Particles -->
  <circle cx="280" cy="50" r="3" fill="#38bdf8" class="floating-dot" opacity="0.6" />
  <circle cx="950" cy="55" r="3.5" fill="#c084fc" class="floating-dot" opacity="0.5" />
  <circle cx="250" cy="300" r="2.5" fill="#818cf8" class="floating-dot" opacity="0.4" />
  <circle cx="920" cy="290" r="3" fill="#38bdf8" class="floating-dot" opacity="0.5" />

  <!-- Center Content Area: GUARANTEED IN FOREGROUND, NEVER HIDDEN -->
  <g transform="translate(600, 0)">
    <!-- Pill Badge: Curated Ecosystem -->
    <g transform="translate(0, 60)">
      <rect x="-135" y="0" width="270" height="28" rx="14" fill="#1e293b" stroke="url(#primaryGlow)" stroke-width="1.2" />
      <circle cx="-112" cy="14" r="4" fill="#34d399" class="pulse-glow" />
      <text x="-98" y="18" fill="#e2e8f0" font-size="11.5" letter-spacing="1.5" class="font-mono">DOCUMENT AI &amp; IDP ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="142" text-anchor="middle" fill="#ffffff" font-size="44" class="font-title" filter="url(#textGlow)">
      Awesome Document Extraction API
    </text>

    <!-- Subtitle -->
    <text x="0" y="182" text-anchor="middle" fill="#94a3b8" font-size="17" class="font-sub">
      Intelligent Document Processing (IDP) • Cloud OCR APIs • Open-Source Multimodal Parsers
    </text>

    <!-- Feature Tags Row -->
    <g transform="translate(0, 230)">
      <!-- Tag 1: PDF to JSON -->
      <g transform="translate(-310, 0)">
        <rect x="0" y="0" width="112" height="34" rx="8" fill="url(#cardBg)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.8" />
        <text x="56" y="22" text-anchor="middle" fill="#7dd3fc" font-size="12" class="font-mono">📄 PDF-to-JSON</text>
      </g>

      <!-- Tag 2: Deep OCR -->
      <g transform="translate(-188, 0)">
        <rect x="0" y="0" width="108" height="34" rx="8" fill="url(#cardBg)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.8" />
        <text x="54" y="22" text-anchor="middle" fill="#a5b4fc" font-size="12" class="font-mono">🔍 Vision OCR</text>
      </g>

      <!-- Tag 3: Table Parsing -->
      <g transform="translate(-70, 0)">
        <rect x="0" y="0" width="140" height="34" rx="8" fill="url(#cardBg)" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.8" />
        <text x="70" y="22" text-anchor="middle" fill="#d8b4fe" font-size="12" class="font-mono">📊 Table Recognition</text>
      </g>

      <!-- Tag 4: VLM & DocLLMs -->
      <g transform="translate(80, 0)">
        <rect x="0" y="0" width="115" height="34" rx="8" fill="url(#cardBg)" stroke="#ec4899" stroke-width="1.2" stroke-opacity="0.8" />
        <text x="57" y="22" text-anchor="middle" fill="#f472b6" font-size="12" class="font-mono">🤖 VLM / LLM</text>
      </g>

      <!-- Tag 5: RAG Pipelines -->
      <g transform="translate(205, 0)">
        <rect x="0" y="0" width="105" height="34" rx="8" fill="url(#cardBg)" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.8" />
        <text x="52" y="22" text-anchor="middle" fill="#6ee7b7" font-size="12" class="font-mono">⚡ RAG Ready</text>
      </g>
    </g>

    <!-- Bottom Metadata Line -->
    <text x="0" y="306" text-anchor="middle" fill="#64748b" font-size="12" class="font-sub">
      Curated list of commercial enterprise SaaS solutions and sovereign self-hosted open-source toolkits
    </text>
  </g>
</svg>